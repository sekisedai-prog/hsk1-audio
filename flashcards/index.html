<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mandarin Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Serif:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--cream:#f4ead4;--gold:#c99a3b;--red:#b0261c;--ink:#1c1413;--mute:#6a5d4c}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);background:radial-gradient(ellipse at 50% 12%,#6e1311,#3a0907 75%);font-family:"Noto Serif","Noto Serif SC",Georgia,serif;color:var(--ink)}
.card{position:relative;width:min(100%,440px);background:var(--cream);border:3px solid var(--gold);padding:46px 26px 22px;text-align:center;box-shadow:0 24px 60px #0007}
.card::before{content:"";position:absolute;inset:12px;border:1px solid var(--gold);pointer-events:none}
.badge{position:absolute;top:-3px;right:34px;width:58px;padding:14px 0 10px;background:var(--red);color:var(--cream);font:900 22px "Noto Serif SC",serif;line-height:1}
.badge small{display:block;margin-top:7px;font:400 13px "Noto Serif",serif;opacity:.9}
.hdr{font-size:13px;letter-spacing:.38em;color:var(--mute);margin-right:70px;padding-left:.38em}
.emo{margin:22px auto 0;width:64px;height:64px;line-height:64px;font-size:36px;border-radius:50%;background:#fff8e6;border:1px solid var(--gold);box-shadow:inset 0 0 0 4px var(--cream),inset 0 0 0 5px #c99a3b66}
.zh{font:900 120px/1.12 "Noto Serif SC",serif;margin:14px 0 4px;min-height:140px;display:flex;align-items:center;justify-content:center;word-break:keep-all}
.py{font:italic 400 30px/1.2 "Noto Serif",serif;color:var(--red);min-height:38px}
.rule{width:96px;height:2px;background:var(--gold);margin:22px auto}
.en{font-size:21px;line-height:1.35;min-height:58px;display:flex;align-items:center;justify-content:center}
.play{margin:14px auto 8px;width:104px;height:104px;border-radius:50%;border:3px solid var(--gold);background:none;display:grid;place-items:center;cursor:pointer;padding:0}
.play i{width:78px;height:78px;border-radius:50%;background:var(--red);display:grid;place-items:center;transition:transform .15s}
.play:active i{transform:scale(.94)}
.play svg{width:30px;height:30px;fill:var(--cream)}
.play.on i{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px #b0261c33}}
.hint{font-size:15px;color:var(--mute);min-height:20px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--gold);font:400 20px "Noto Serif SC","Noto Serif",serif}
.nav button{background:none;border:0;font:inherit;color:var(--ink);padding:8px 14px;cursor:pointer}
.nav button:focus-visible,.play:focus-visible{outline:2px solid var(--red);outline-offset:3px}
#all{position:fixed;inset:0;background:#2c0706f2;overflow:auto;padding:max(20px,env(safe-area-inset-top)) 14px 30px;display:none}
#all.open{display:block}
.grid{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.grid button{background:var(--cream);border:1px solid var(--gold);padding:10px 4px;cursor:pointer;font:700 17px/1.3 "Noto Serif SC",serif;color:var(--ink)}
.grid button span{display:block;font-size:24px;margin-bottom:2px}
.x{display:block;margin:0 auto 16px;background:none;border:1px solid var(--gold);color:var(--cream);font:400 16px "Noto Serif",serif;padding:8px 22px;cursor:pointer}
@media(max-width:380px){.zh{font-size:96px}.py{font-size:26px}}
@media(prefers-reduced-motion:reduce){.play.on i{animation:none}}
</style></head><body>
<main class="card" id="card">
 <div class="badge"><span id="bt"></span><small id="bn"></small></div>
 <div class="hdr">汉语 · MANDARIN</div>
 <div class="emo" id="emo" aria-hidden="true"></div>
 <div class="zh" id="zh" lang="zh-Hans"></div>
 <div class="py" id="py"></div>
 <div class="rule"></div>
 <div class="en" id="en"></div>
 <button class="play" id="play" aria-label="Play audio"><i><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg></i></button>
 <div class="hint" id="hint">Tap to listen</div>
 <nav class="nav"><button id="prev" aria-label="Previous card">‹ 上</button><button id="openall">全部 · All</button><button id="next" aria-label="Next card">下 ›</button></nav>
</main>
<section id="all" aria-label="All cards"><button class="x" id="close">Close</button><div class="grid" id="grid"></div></section>

const $=id=>document.getElementById(id);
let i=0,au=null;
function stop(){if(au){au.pause();au=null}$("play").classList.remove("on")}
function show(k){
  i=(k+C.length)%C.length;const c=C[i];stop();
  $("bt").textContent=c.t;$("bn").textContent=c.n;$("emo").textContent=c.e;
  const z=$("zh");z.textContent=c.zh;
  const len=[...c.zh].length,w=Math.min(innerWidth,440)-90;
  z.style.fontSize=Math.max(40,Math.min(innerWidth<381?96:120,Math.floor(w/Math.min(len,5)*.98)))+"px";
  $("py").textContent=c.py;$("en").textContent=c.en;$("hint").textContent="Tap to listen";
  history.replaceState(null,"","?c="+String(c.n).padStart(2,"0"));
}
function play(){
  if(au){stop();$("hint").textContent="Tap to listen";return}
  const c=C[i],f=String(c.n).padStart(2,"0");
  const a=new Audio("audio2/"+f+".mp3");au=a;
  let retried=false;
  a.onerror=()=>{if(!retried){retried=true;a.src=c.a;a.play().catch(()=>{})}else{$("hint").textContent="Audio unavailable";stop()}};
  a.onended=()=>{stop();$("hint").textContent="Tap to listen again"};
  $("play").classList.add("on");$("hint").textContent="Playing…";
  a.play().catch(()=>{});
}
$("play").onclick=play;$("prev").onclick=()=>show(i-1);$("next").onclick=()=>show(i+1);
$("openall").onclick=()=>$("all").classList.add("open");$("close").onclick=()=>$("all").classList.remove("open");
$("grid").innerHTML=C.map((c,k)=>`<button data-k="${k}"><span>${c.e}</span>${c.zh.length>6?c.zh.slice(0,5)+"…":c.zh}</button>`).join("");
$("grid").onclick=e=>{const b=e.target.closest("button");if(b){show(+b.dataset.k);$("all").classList.remove("open")}};
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")show(i-1);if(e.key==="ArrowRight")show(i+1);if(e.key===" "&&e.target===document.body){e.preventDefault();play()}if(e.key==="Escape")$("all").classList.remove("open")});

$("card").addEventListener("touchend",e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(d)>60)show(i+(d<0?1:-1))},{passive:true});

show(Math.max(0,C.findIndex(c=>c.n===parseInt(q,10))));
